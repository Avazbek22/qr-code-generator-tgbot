[project]
name = "qr-code-generator-tgbot"
version = "1.0.0"
description = "Private self-hosted Telegram bot for generating PNG QR codes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "Pillow==12.3.0",
    "pyTelegramBotAPI==4.36.0",
    "qrcode==8.2",
]
keywords = [
    "telegram-bot",
    "qr-code",
    "qr-code-generator",
    "self-hosted",
    "docker",
    "python",
    "privacy",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/Avazbek22/qr-code-generator-tgbot"
Repository = "https://github.com/Avazbek22/qr-code-generator-tgbot"
Issues = "https://github.com/Avazbek22/qr-code-generator-tgbot/issues"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/i18n.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
