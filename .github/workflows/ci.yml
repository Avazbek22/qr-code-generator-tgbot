name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - name: Import-safe smoke test
        run: python -c "import main, threading; assert len(threading.enumerate()) == 1"

  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: ShellCheck
        run: shellcheck install.sh scripts/*.sh tests/shell/*.sh tests/e2e/*.sh
      - name: Deployment shell tests
        run: bash tests/shell/test-deploy.sh
      - name: Docker Compose configuration
        run: |
          test ! -e .env
          ENV_FILE=.env-example APP_SLUG=ci-qr-bot docker compose config --quiet
          ENV_FILE=.env-example APP_SLUG=ci-qr-bot APP_IMAGE_TAG=candidate \
            docker compose config | grep -q 'image: ci-qr-bot:candidate'
          test ! -e .env
      - name: Build production image
        run: docker build --tag qr-code-generator-tgbot:ci .
      - name: Verify image UID and excluded secrets
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' qr-code-generator-tgbot:ci)" = "10001:10001"
          docker run --rm --entrypoint sh qr-code-generator-tgbot:ci -ec \
            'test "$(id -u):$(id -g)" = "10001:10001"; test ! -e /app/.env'
      - name: Verify image healthcheck and import safety
        run: |
          test "$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' qr-code-generator-tgbot:ci)" \
            = '["CMD","python","-m","app.healthcheck"]'
          docker run --rm --entrypoint python qr-code-generator-tgbot:ci -c \
            "import main, threading; assert len(threading.enumerate()) == 1"
      - name: Verify read-only root filesystem
        run: |
          docker run --rm --read-only --user 0 --entrypoint sh qr-code-generator-tgbot:ci \
            -ec '! touch /root-filesystem-must-be-read-only 2>/dev/null'

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install, deploy, fail, and roll back with real Docker
        run: sudo bash tests/e2e/run.sh
